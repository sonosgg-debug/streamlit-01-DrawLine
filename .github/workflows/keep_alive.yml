name: Keep Alive Streamlit

on:
  schedule:
    # 매 3일마다 UTC 00:00 (KST 09:00)에 실행
    - cron: '0 0 */3 * *'
  # GitHub 웹 Actions 탭에서 수동 실행 지원
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create empty commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit --allow-empty -m "chore: keep-alive empty commit to prevent Streamlit sleeping"
          git push origin main
